name: AI Dynasty Build Check

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["feature/ai-dynasty-slot"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: TypeScript and Vite build
        run: npm run build
